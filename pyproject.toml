[project]
name = "scanow"
version = "2.0.0"
description = "Offline Windows document scanning and library"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "Pillow>=11,<13", "PyMuPDF>=1.26,<2"]

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["installer*"]
