[project]
name = "scanow"
version = "0.1.0"
description = "Offline Windows document scanning and library"
requires-python = ">=3.11"
dependencies = ["flet>=1.0,<2", "flet-desktop>=1.0,<2", "Pillow>=11,<13", "PyMuPDF>=1.26,<2"]

[project.optional-dependencies]
build = ["flet-cli>=1.0,<2"]

[tool.flet]
product = "ScaNow"
company = "ScaNow"
build_number = 1

[tool.flet.app]
path = "."
module = "main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["installer*"]
